<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101113" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="前車提醒" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>前車提醒</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=2.0.0" />
  </head>
  <body>
    <main class="app-shell" aria-live="polite">
      <section class="stage" aria-label="相機偵測畫面">
        <video id="camera" class="camera" playsinline muted autoplay></video>
        <canvas id="analysisCanvas" class="analysis-canvas" aria-hidden="true"></canvas>
        <div id="demoLight" class="demo-light vehicle-demo" aria-hidden="true">
          <span class="road-line left"></span>
          <span class="road-line right"></span>
          <span class="demo-car">
            <span class="tail left"></span>
            <span class="tail right"></span>
          </span>
        </div>
        <div id="roiBox" class="roi-box" aria-hidden="true">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
        </div>
        <div id="flash" class="flash" aria-hidden="true"></div>

        <header class="topbar">
          <div>
            <p class="eyebrow">iPhone PWA <span id="versionLabel">v--</span></p>
            <h1>前車提醒</h1>
          </div>
          <span id="stateBadge" class="state-badge idle">待機</span>
        </header>

        <div class="meter-panel">
          <div class="meter-row">
            <span>穩</span>
            <meter id="redMeter" min="0" max="100" value="0"></meter>
            <strong id="redValue">0</strong>
          </div>
          <div class="meter-row">
            <span>動</span>
            <meter id="greenMeter" min="0" max="100" value="0"></meter>
            <strong id="greenValue">0</strong>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="控制區">
        <div class="primary-actions">
          <button id="startBtn" class="primary" type="button">開始監看</button>
          <button id="testBtn" type="button">測試提醒</button>
        </div>

        <div class="control-grid">
          <label>
            <span>移動靈敏度</span>
            <input id="sensitivity" type="range" min="20" max="80" value="44" />
          </label>
          <label>
            <span>停止秒數</span>
            <input id="holdFrames" type="range" min="3" max="10" value="5" />
          </label>
          <label>
            <span>區域 X</span>
            <input id="roiX" type="range" min="0" max="80" value="22" />
          </label>
          <label>
            <span>區域 Y</span>
            <input id="roiY" type="range" min="0" max="60" value="16" />
          </label>
          <label>
            <span>區域寬</span>
            <input id="roiW" type="range" min="12" max="70" value="56" />
          </label>
          <label>
            <span>區域高</span>
            <input id="roiH" type="range" min="10" max="75" value="34" />
          </label>
        </div>

        <div class="toggles">
          <label class="switch">
            <input id="soundToggle" type="checkbox" checked />
            <span>聲音</span>
          </label>
          <label class="switch">
            <input id="vibrateToggle" type="checkbox" checked />
            <span>震動</span>
          </label>
          <label class="switch">
            <input id="notifyToggle" type="checkbox" />
            <span>通知</span>
          </label>
          <label class="switch">
            <input id="demoToggle" type="checkbox" />
            <span>模擬</span>
          </label>
          <label class="switch">
            <input id="autoToggle" type="checkbox" checked />
            <span>自動</span>
          </label>
        </div>

        <p id="message" class="message">
          請固定手機，讓框線包住前車。前車移動提示只作輔助，起步前仍需確認路況。
        </p>
      </section>
    </main>

    <script src="./app.js?v=2.0.0" type="module"></script>
  </body>
</html>
